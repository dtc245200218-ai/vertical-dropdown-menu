<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Dropdown Menu</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        padding: 40px;
        background-color: #f5f5f5;
      }

      h1 {
        margin-bottom: 25px;
        color: #333;
      }

      #menu,
      #menu ul {
        list-style: none;
      }

      #menu {
        width: 140px;
      }

      #menu li {
        position: relative;
        width: 140px;
        height: 40px;
        line-height: 40px;
        padding: 0 20px;
        background-color: black;
        cursor: pointer;
      }

      #menu li:hover {
        background-color: #555;
      }

      #menu a {
        display: block;
        color: white;
        text-decoration: none;
      }

      #menu ul {
        position: absolute;
        top: 0;
        left: 140px;
        visibility: hidden;
      }

      #menu li:hover > ul {
        visibility: visible;
      }

      .description {
        margin-top: 25px;
        color: #555;
      }
    </style>
  </head>

  <body>
    <h1>Vertical Dropdown Menu</h1>

    <div id="menu">
      <ul>
        <li><a href="#home">Home</a></li>

        <li>
          <a href="#products">Products ▸</a>
          <ul>
            <li><a href="#laptop">Laptop</a></li>
            <li><a href="#phone">Phone</a></li>
            <li><a href="#tablet">Tablet</a></li>
          </ul>
        </li>

        <li>
          <a href="#services">Services ▸</a>
          <ul>
            <li><a href="#design">Web Design</a></li>
            <li><a href="#development">Development</a></li>
            <li><a href="#support">Support</a></li>
          </ul>
        </li>

        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>

    <p class="description">
      Di chuột vào Products hoặc Services để xem menu con.
    </p>
  </body>
</html>
